<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>데이터 창구</title>
<style>
/* This page holds no data. Everything it shows comes from the private repo, using the viewer's own token. */
:root {
  --bg: #eef2f0; --panel: #fbfcfb; --sheet: #ffffff; --head: #e3e9e6;
  --line: #d2dad6; --fg: #17211d; --muted: #5b6a63;
  --in: #0f6b4f; --out: #3a4fb0; --warn: #a3341f; --on-accent: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --grid: #e6ebe8;
  --sans: "Malgun Gothic", "Segoe UI", sans-serif;
  --mono: Consolas, "Malgun Gothic", monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121715; --panel: #181f1c; --sheet: #1c2421; --head: #252e2a;
  --line: #333f3a; --fg: #e6ece9; --muted: #98a7a0;
  --in: #4fc29b; --out: #9aa9f2; --warn: #f09a86; --on-accent: #10231c; color-scheme: dark;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --grid: #2a3430;
} }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); padding: 12px 16px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--in); outline-offset: 1px; }
a { color: var(--out); }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); gap: 10px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.top h1 { font-size: 18px; font-weight: 700; margin: 0; }
.tabs { display: flex; gap: 4px; }
.tab { border: 1px solid var(--line); background: var(--panel); padding: 4px 14px; cursor: pointer; font-weight: 600; }
.tab[aria-selected="true"] { background: var(--in); border-color: var(--in); color: var(--on-accent); }
#tabIn[aria-selected="true"] { background: var(--out); border-color: var(--out); }
.who { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }

.pane { background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; padding: 12px; min-height: 0; min-width: 0; }
.login { max-width: 640px; width: 100%; margin: 0 auto; align-self: start; }
.login h2 { font-size: 17px; margin: 0; }
.login ol { margin: 0; padding-left: 20px; }
.login p { margin: 0; }
.drop { flex: 1; min-height: 180px; width: 100%; resize: none; border: 2px dashed var(--line); background: var(--sheet); padding: 18px; text-align: center; }
.drop::placeholder { color: var(--muted); }
.drop:focus { border-color: var(--in); outline: none; }
body.dragging .drop { border-color: var(--out); }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input { border: 1px solid var(--line); background: var(--sheet); padding: 6px 8px; color: var(--fg); width: 100%; font-size: 15px; }
.check { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .grow { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--sheet); padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--head); }
.btn.small { padding: 1px 8px; font-size: 13px; }
.btn.primary { background: var(--in); border-color: var(--in); color: var(--on-accent); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.next { background: var(--sheet); border: 1px solid var(--in); padding: 8px 12px; margin: 0; }
.err { color: var(--warn); margin: 0; font-size: 14px; }
progress { width: 100%; height: 10px; accent-color: var(--in); }
.list { display: flex; flex-direction: column; gap: 4px; max-height: 30%; overflow-y: auto; flex-shrink: 0; }
.item { text-align: left; font: 13px var(--mono); }
.item[aria-current="true"] { border-color: var(--out); }
.dh h2 { font-size: 17px; margin: 0; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.note { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sheet); border: 1px solid var(--line); padding: 10px 12px; max-height: 38%; overflow-y: auto; flex-shrink: 0; }

.grid { flex: 1; min-height: 120px; overflow: auto; border: 1px solid var(--line); background: var(--sheet); }
table { border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 2px 8px; white-space: pre; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
thead th { position: sticky; top: 0; background: var(--head); font: 500 12px var(--mono); color: var(--muted); z-index: 2; text-align: center; }
tbody th { position: sticky; left: 0; background: var(--head); font: 500 12px var(--mono); color: var(--muted); z-index: 1; text-align: right; }
thead th:first-child { left: 0; z-index: 3; }
td.num { text-align: right; font-family: var(--mono); }

/* reply views */
.sub { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.sub button { border: 0; border-bottom: 3px solid transparent; background: none; padding: 6px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.sub button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--out); }
.view { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.view > .grid { min-height: 240px; }
.empty { color: var(--muted); margin: 0; padding: 16px 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.kpi { background: var(--sheet); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.kpi .k { font-size: 13px; color: var(--muted); }
.kpi .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .d { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 10px; }
.card { position: relative; background: var(--sheet); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card h3 { font-size: 15px; margin: 0; }
.card .cn { font-size: 13px; color: var(--muted); margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.box { height: 10px; }
.card svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.card svg text { fill: var(--muted); font: 11px var(--sans); }
.card svg .val { fill: var(--fg); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.15); padding: 6px 9px; font-size: 13px; white-space: nowrap; z-index: 5; font-variant-numeric: tabular-nums; }
.tip b { display: block; margin-bottom: 2px; }
.tip div { display: flex; align-items: center; gap: 6px; }
.tip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.tip em { font-style: normal; margin-left: auto; padding-left: 12px; font-weight: 600; }
.summary { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid var(--out); padding: 10px 12px; margin: 0; white-space: pre-wrap; }
.items { display: grid; gap: 8px; }
.items article { background: var(--sheet); border: 1px solid var(--line); padding: 10px 12px; }
.items h3 { font-size: 15px; margin: 0 0 4px; display: flex; gap: 8px; align-items: baseline; }
.items h3 small { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); padding: 0 6px; }
.items p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.files { display: flex; flex-wrap: wrap; gap: 4px; }

@media (max-width: 700px) {
  html, body { height: auto; }
  .app { height: auto; }
  .pane { min-height: 70vh; }
  .login { min-height: 0; }
  .fields { grid-template-columns: minmax(0, 1fr); }
}
/* 인쇄: the open reply view only, light colors, cards kept whole */
@media print {
  :root {
    --bg: #ffffff; --panel: #ffffff; --sheet: #ffffff; --head: #eef1ef;
    --line: #c9d1cd; --fg: #111111; --muted: #4f5b55; --out: #3a4fb0; color-scheme: light;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --grid: #e6ebe8;
  }
  @page { size: A4; margin: 10mm; }
  html, body, .app { height: auto; }
  body { padding: 0; background: #fff; font-size: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .top, #readPane > .bar, #list, #rTabs, #rHead .btn, .tip, .err, #vTable .bar, #vSrc .bar, #sFiles { display: none !important; }
  .pane { border: 0; padding: 0; gap: 8px; }
  .view { overflow: visible; flex: none; }
  .grid { overflow: visible; max-height: none; }
  .charts { grid-template-columns: 1fr 1fr; }
  .kpis { grid-template-columns: repeat(3, 1fr); }
  .kpi, .card, .items article, .summary { break-inside: avoid; }
}
</style>

<div class="app">
  <header class="top">
    <h1>데이터 창구</h1>
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" id="tabOut" role="tab" type="button" aria-selected="true">보내기</button>
      <button class="tab" id="tabIn" role="tab" type="button" aria-selected="false">답장 보기</button>
    </div>
    <span class="who" id="who" hidden>연결됨 <button class="btn small" id="logoutBtn" type="button">연결 끊기</button></span>
  </header>

  <section class="pane login" id="loginPane">
    <h2>열쇠로 연결하기</h2>
    <ol>
      <li><a href="https://github.com/settings/personal-access-tokens/new?name=data-window&amp;description=Data%20window%20page&amp;target_name=msg-85&amp;expires_in=90&amp;contents=write" target="_blank" rel="noopener noreferrer">GitHub 열쇠 만들기 화면</a>을 엽니다.</li>
      <li><b>Repository access</b>에서 <b>Only select repositories</b>를 고르고 <b>price-data</b>만 선택합니다.</li>
      <li><b>Contents</b>가 <b>Read and write</b>인지 확인하고 <b>Generate token</b>을 누릅니다.</li>
      <li>나온 열쇠(<code>github_pat_</code>로 시작)를 복사해 아래에 붙여넣습니다.</li>
    </ol>
    <label class="field">열쇠<input id="token" type="password" autocomplete="off" spellcheck="false"></label>
    <label class="check"><input id="remember" type="checkbox"> 이 브라우저에 기억하기 (혼자 쓰는 컴퓨터에서만)</label>
    <div class="bar">
      <span class="grow">열쇠는 GitHub에만 전달됩니다. 디스코드나 대화창에는 보내지 마세요.</span>
      <button class="btn primary" id="loginBtn" type="button">연결</button>
    </div>
    <p class="err" id="loginErr" hidden></p>
  </section>

  <section class="pane" id="sendPane" hidden>
    <textarea class="drop" id="drop" aria-label="엑셀 데이터 붙여넣기" placeholder="엑셀에서 셀을 복사해 여기에 붙여넣거나, 파일을 이 창에 끌어다 놓으세요."></textarea>
    <div class="grid" id="draftGrid" hidden></div>
    <div class="fields">
      <label class="field">제목<input id="title" type="text" maxlength="80" placeholder="예: 2024-2026 판매가"></label>
      <label class="field">Claude에게 요청 (선택)<input id="note" type="text" maxlength="2000" placeholder="예: 품목별 월평균을 내주고 이상한 값을 찾아줘"></label>
    </div>
    <progress id="prog" max="1" value="0" hidden></progress>
    <div class="bar">
      <span class="grow" id="draftInfo">표를 붙여넣거나 파일을 고르면 올릴 수 있습니다.</span>
      <input id="upIn" type="file" multiple hidden>
      <button class="btn" id="clearBtn" type="button" hidden>지우기</button>
      <button class="btn" id="upPick" type="button">파일 선택</button>
      <button class="btn primary" id="sendBtn" type="button" disabled>올리기</button>
    </div>
    <p class="next" id="saved" hidden></p>
    <p class="err" id="sendErr" hidden></p>
  </section>

  <section class="pane" id="readPane" hidden>
    <div class="bar">
      <span class="grow" id="listInfo"></span>
      <button class="btn" id="refreshBtn" type="button">새로고침</button>
    </div>
    <div class="list" id="list"></div>
    <div class="dh bar" id="rHead" hidden><h2 id="rTitle"></h2><button class="btn" id="printBtn" type="button">인쇄</button><button class="btn primary" id="xlsxBtn" type="button">엑셀로 내려받기</button></div>
    <div class="sub" role="tablist" id="rTabs" hidden>
      <button type="button" role="tab" data-v="vDash">대시보드</button>
      <button type="button" role="tab" data-v="vNote">분석</button>
      <button type="button" role="tab" data-v="vTable">결과표</button>
      <button type="button" role="tab" data-v="vSrc">올린 데이터</button>
    </div>
    <div class="view" id="vDash" hidden></div>
    <div class="view" id="vNote" hidden></div>
    <div class="view" id="vTable" hidden>
      <div class="grid" id="rGrid" hidden></div>
      <div class="bar">
        <span class="grow" id="rInfo"></span>
        <button class="btn primary" id="copyBtn" type="button" hidden>표 복사 (엑셀에 붙여넣기용)</button>
      </div>
    </div>
    <div class="view" id="vSrc" hidden>
      <p class="cn" id="sNote" hidden></p>
      <div class="files" id="sFiles"></div>
      <div class="grid" id="sGrid" hidden></div>
      <div class="bar">
        <span class="grow" id="sInfo"></span>
        <button class="btn primary" id="sCopy" type="button" hidden>표 복사 (엑셀에 붙여넣기용)</button>
      </div>
    </div>
    <p class="err" id="rErr" hidden></p>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const REPO = '/repos/msg-85/price-data';
  const PART = 8 * 1024 * 1024;              // bytes of compressed data per uploaded piece
  const MAX_ROWS = 500, MAX_CELLS = 30000;   // on-screen preview only
  const KEY = 'data-window-token';
  let token = '', draft = null, files = [], reply = null, busy = false;

  // ---------- storage: may be unavailable, so never let it stop the page ----------
  const store = {
    get() { for (const s of ['sessionStorage', 'localStorage']) { try { const v = window[s].getItem(KEY); if (v) return v; } catch (e) {} } return ''; },
    set(v, keep) { try { window[keep ? 'localStorage' : 'sessionStorage'].setItem(KEY, v); } catch (e) {} },
    clear() { for (const s of ['sessionStorage', 'localStorage']) { try { window[s].removeItem(KEY); } catch (e) {} } },
  };

  // ---------- GitHub ----------
  class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
  async function api(path, opts = {}) {
    const res = await fetch('https://api.github.com' + REPO + path, {
      cache: 'no-store', ...opts,
      headers: { Authorization: 'Bearer ' + token, Accept: opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
    });
    if (!res.ok) {
      let msg = ''; try { msg = (await res.json()).message || ''; } catch (e) {}
      throw new ApiError(res.status, msg);
    }
    return res;
  }
  function explain(e) {
    if (e.status === 401) return '열쇠가 맞지 않거나 기간이 끝났습니다. 연결을 끊고 새 열쇠로 다시 연결해 주세요.';
    if (e.status === 403) return '이 열쇠에 쓰기 권한이 없습니다. Contents가 Read and write인지 확인해 주세요.';
    if (e.status === 404) return '저장소를 찾지 못했습니다. 열쇠를 만들 때 price-data를 선택했는지 확인해 주세요.';
    if (e instanceof TypeError) return 'GitHub에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.';
    return 'GitHub 오류입니다: ' + (e.status || '') + ' ' + e.message;
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function toBase64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  // Commits happen one at a time, so a retry after a dropped reply can find the file already there.
  async function put(path, base64, message) {
    const body = JSON.stringify({ message, content: base64 });
    for (let attempt = 0; ; attempt++) {
      try { await api('/contents/' + path, { method: 'PUT', body }); return; }
      catch (e) {
        if (e.status === 422 && attempt > 0) return;
        const retry = e instanceof TypeError || e.status === 409 || e.status === 429 || e.status >= 500;
        if (!retry || attempt >= 4) throw e;
        await wait(2000 * 2 ** attempt);
      }
    }
  }

  // ---------- login ----------
  async function connect(t, keep, quiet) {
    token = t; $('loginBtn').disabled = true; $('loginErr').hidden = true;
    try {
      await api('');
      store.set(t, keep);
      $('token').value = '';
      $('loginPane').hidden = true; $('tabs').hidden = false; $('who').hidden = false;
      tab('send');
    } catch (e) {
      token = ''; if (e.status === 401) store.clear();
      if (!quiet || e.status !== 401) { $('loginErr').textContent = explain(e); $('loginErr').hidden = false; }
    }
    $('loginBtn').disabled = false;
  }
  $('loginBtn').addEventListener('click', () => { const t = $('token').value.trim(); if (t) connect(t, $('remember').checked); });
  $('token').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('logoutBtn').addEventListener('click', () => {
    if (busy) return;
    store.clear(); token = '';
    $('sendPane').hidden = true; $('readPane').hidden = true; $('tabs').hidden = true; $('who').hidden = true;
    $('loginPane').hidden = false;
  });

  // ---------- tabs ----------
  function tab(name) {
    const send = name === 'send';
    $('sendPane').hidden = !send; $('readPane').hidden = send;
    $('tabOut').setAttribute('aria-selected', String(send));
    $('tabIn').setAttribute('aria-selected', String(!send));
    if (!send) loadList();
  }
  $('tabOut').addEventListener('click', () => tab('send'));
  $('tabIn').addEventListener('click', () => tab('read'));

  // ---------- table helpers ----------
  const clean = t => t.replace(/^﻿/, '').replace(/\r\n?/g, '\n').replace(/\n+$/, '');
  function split(text, d) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"' && cell === '') q = true;
      else if (c === d) { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    row.push(cell); rows.push(row);
    return q ? text.split('\n').map(l => l.split(d)) : rows;   // a stray quote: read it literally
  }
  function parse(text) {
    const first = text.split('\n', 1)[0];
    const d = text.includes('\t') || !first.includes(',') ? '\t' : ',';
    const rows = split(text, d);
    return { rows, delim: d, cols: rows.reduce((m, r) => Math.max(m, r.length), 0) };
  }
  // Reply file: optional "#TITLE:" and "#NOTE:" lines (note newlines written as \n), then the table.
  function readFile(text) {
    let body = clean(text), title = '', note = '', m;
    while ((m = /^#(TITLE|NOTE): ?(.*)(\n|$)/.exec(body))) {
      if (m[1] === 'TITLE') title = m[2]; else note = m[2].replace(/\\n/g, '\n');
      body = body.slice(m[0].length);
    }
    return { title, note, body };
  }
  const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; };
  const isNum = v => /^-?[\d,]*\.?\d+%?$/.test(v);
  function drawGrid(host, t) {
    const shown = Math.min(t.rows.length, MAX_ROWS, Math.max(1, Math.floor(MAX_CELLS / Math.max(1, t.cols))));
    const table = document.createElement('table');
    const head = table.createTHead().insertRow();
    head.appendChild(document.createElement('th'));
    for (let c = 0; c < t.cols; c++) { const th = document.createElement('th'); th.textContent = colName(c); head.appendChild(th); }
    const body = table.createTBody();

  // ---------- upload ----------
  // A file is read, gzipped and sent piece by piece, so a 300MB file never sits in memory whole.

  async function sendOne(file, index, stamp, onProgress) {

  // ---------- Excel download: one .xlsx built here (no outside library), one sheet per part of the reply ----------
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  function sheetXml(sh) {

    for (let c = 0; c < cols; c++) {
      let m = 6; for (let r = 0; r < Math.min(sh.rows.length, 2000); r++) { const v = String(sh.rows[r][c] ?? ''); let n = 0; for (const ch of v.split('\n')[0]) n += ch.charCodeAt(0) > 0x2e80 ? 2 : 1; m = Math.max(m, n); }

      { name: '[Content_Types].xml', data: hdr + `<Types xmlns="${ns}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>` +
        sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>' },
      { name: '_rels/.rels', data: hdr + `<Relationships xmlns="${ns}package/2006/relationships"><Relationship Id="rId1" Type="${ns}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', data: hdr + `<workbook xmlns="${ns}spreadsheetml/2006/main" xmlns:r="${ns}officeDocument/2006/relationships"><sheets>` +
        names.map((n, i) => `<sheet name="${xesc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: hdr + `<Relationships xmlns="${ns}package/2006/relationships">` +
        sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${ns}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
        `<Relationship Id="rId${sheets.length + 1}" Type="${ns}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', data: hdr + `<styleSheet xmlns="${ns}spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.0%"/></numFmts>` +
        '<fonts count="2"><font><sz val="10"/><name val="맑은 고딕"/><family val="3"/></font><font><b/><sz val="10"/><name val="맑은 고딕"/><family val="3"/></font></fonts>' +
        '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3E9E6"/></patternFill></fill></fills>' +
        '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        '<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
        '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>' +
        '<xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>' },
      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s) })),
    ]);
  }
  // Analysis items: from the JSON, or for a plain reply the first paragraph is the summary
  // and every other paragraph or numbered line is an item. Used by the 분석 tab and the Excel file.
  function noteItems(note, extra) {
    if (extra && extra.items) return { summary: extra.summary || '', items: extra.items };
    const paras = (note || '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    const summary = (extra && extra.summary) || paras.shift() || '', items = [];
    for (const p of paras) for (const part of p.split(/\n(?=\d+\.\s)/)) {
      const lines = part.split('\n'), m = /^(\d+)\.\s*(.*)$/.exec(lines[0]);
      if (m) items.push({ tag: m[1], title: m[2].split(/[.:]\s/)[0], body: part.replace(/^\d+\.\s*/, '') });
      else items.push({ title: lines.length > 1 ? lines[0] : '', body: lines.length > 1 ? lines.slice(1).join('\n') : part });
    }
    return { summary, items };
  }
  async function downloadXlsx() {
    if (!cur) return;
    const c = cur, btn = $('xlsxBtn'); btn.disabled = true; btn.textContent = '엑셀 만드는 중…';
    try {
      const st = srcState;
      if (st && st.stamp && !st.loaded) st.loading = loadSource();
      if (st && st.loading) await st.loading;
      if (c !== cur) return;
      const sheets = [], x = c.extra || {}, a = noteItems(c.note, c.extra);
      const sum = [['항목', '값', '설명'], ['제목', c.title, ''], ['답장 파일', c.name, '']];
      if (st && st.stamp) sum.push(['올린 데이터 번호', st.stamp, '']);
      if (a.summary) sum.push(['결론', a.summary, '']);
      for (const k of x.kpis || []) sum.push([k.label, k.value, k.delta || '']);
      sheets.push({ name: '요약', rows: sum, header: true, wrap: [1, 2], widths: [26, 60, 40] });
      if (a.items.length) sheets.push({ name: '분석', rows: [['구분', '제목', '내용'], ...a.items.map(i => [i.tag || '', i.title || '', i.body || ''])], header: true, wrap: [1, 2], widths: [12, 30, 100] });
      if (c.body) sheets.push({ name: '결과표', rows: parse(c.body).rows, header: true });
      if ((x.charts || []).length) {
        const rows = [];
        for (const ch of x.charts) {
          const labels = ch.type === 'bar' ? (ch.categories || []) : (ch.x || []), series = ch.series || [];
          rows.push([ch.title || ''], ['', ...series.map(s => s.name)]);
          labels.forEach((l, i) => rows.push([l, ...series.map(s => s.values[i] == null ? '' : (ch.unit === '%' ? s.values[i] + '%' : s.values[i]))]));
          if (ch.note) rows.push(['※ ' + ch.note]);
          rows.push([]);
        }
        sheets.push({ name: '그래프 데이터', rows, widths: [22, 14, 14, 14, 14, 14] });
      }
      if (st && st.table) sheets.push({ name: st.cut ? '올린 데이터(앞부분)' : '올린 데이터', rows: st.table.rows });
      const blob = await buildXlsx(sheets);
      const a2 = document.createElement('a'), url = URL.createObjectURL(blob);
      a2.href = url; a2.download = (c.title.replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 80) || 'reply') + '.xlsx';
      document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      btn.textContent = '내려받았습니다';
    } catch (e) {
      btn.textContent = '엑셀로 내려받기';
      $('rErr').textContent = '엑셀 파일을 만들지 못했습니다. ' + (e.status ? explain(e) : (e.message || '')); $('rErr').hidden = false;
    }
    btn.disabled = false;
  }
  $('xlsxBtn').addEventListener('click', downloadXlsx);
  $('printBtn').addEventListener('click', () => window.print());

  // ---------- dashboard ----------
  const SVGNS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];
  const fmt = (v, unit) => v == null ? '–' : (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (+v.toFixed(1)).toLocaleString()) + (unit || '');
  function ticks(lo, hi, n) {
    if (lo === hi) { lo -= 1; hi += 1; }
    const raw = (hi - lo) / n, p = 10 ** Math.floor(Math.log10(raw)), s = [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw);
    const out = []; for (let v = Math.floor(lo / s) * s; v <= hi + s * 1e-9; v += s) out.push(+v.toFixed(6));
    if (out[out.length - 1] < hi) out.push(out[out.length - 1] + s);
    return out;
  }
  function drawDash(extra) {
    const host = $('vDash'); host.replaceChildren();
    if (!extra || !(extra.kpis || extra.charts)) { host.appendChild(el('p', 'empty', '이 답장에는 대시보드가 없습니다. 분석과 결과표 탭을 봐주세요.')); return; }
    if (extra.kpis) {
      const k = el('div', 'kpis');
      for (const x of extra.kpis) { const c = el('div', 'kpi'); c.append(el('span', 'k', x.label), el('span', 'v', x.value)); if (x.delta) c.appendChild(el('span', 'd', x.delta)); k.appendChild(c); }
      host.appendChild(k);
    }
    const g = el('div', 'charts');
    for (const ch of extra.charts || []) { try { g.appendChild(chart(ch)); } catch (e) { g.appendChild(el('p', 'err', '그래프를 그리지 못했습니다: ' + (ch.title || ''))); } }
    host.appendChild(g);
  }
  function chart(ch) {
    const card = el('div', 'card'); card.appendChild(el('h3', '', ch.title || ''));
    const series = ch.series || [];
    if (series.length > 1) {
      const lg = el('div', 'legend');
      series.forEach((s, i) => { const sp = el('span'); const sw = el('i', ch.type === 'bar' ? 'box' : ''); sw.style.background = COLORS[i % COLORS.length]; sp.append(sw, s.name); lg.appendChild(sp); });
      card.appendChild(lg);
    }
    const tip = el('div', 'tip'); tip.hidden = true;
    const svg = (ch.type === 'bar' ? barChart : lineChart)(ch, series, tip, card);
    card.append(svg, tip);
    if (ch.note) card.appendChild(el('p', 'cn', ch.note));
    return card;
  }
  function showTip(tip, card, title, rows, x, y) {
    tip.replaceChildren(el('b', '', title));
    for (const r of rows) { const d = el('div'); const sw = el('i'); sw.style.background = r.color; d.append(sw, r.name, el('em', '', r.value)); tip.appendChild(d); }
    tip.hidden = false;
    const cw = card.clientWidth, tw = tip.offsetWidth;
    tip.style.left = Math.max(4, Math.min(cw - tw - 4, x + 12)) + 'px'; tip.style.top = (y + 12) + 'px';
  }
  function local(svg, card, e, W) {
    const r = svg.getBoundingClientRect(), cr = card.getBoundingClientRect();
    return { vx: (e.clientX - r.left) * W / r.width, cx: e.clientX - cr.left, cy: e.clientY - cr.top };
  }
  function lineChart(ch, series, tip, card) {
    const W = 560, H = 240, L = 54, R = 14, T = 10, B = 26, x = ch.x || [];
    const all = series.flatMap(s => s.values).filter(v => v != null);
    let lo = Math.min(...all), hi = Math.max(...all);
    if (ch.zero !== false && lo >= 0 && lo < hi * 0.5) lo = 0;
    const tk = ticks(lo, hi, 4); lo = tk[0]; hi = tk[tk.length - 1];
    const px = i => x.length < 2 ? (L + W - R) / 2 : L + i * (W - L - R) / (x.length - 1);
    const py = v => T + (hi - v) * (H - T - B) / (hi - lo);
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': ch.title || '' });
    for (const v of tk) { sv('line', { x1: L, x2: W - R, y1: py(v), y2: py(v), stroke: 'var(--grid)' }, svg); sv('text', { x: L - 6, y: py(v) + 4, 'text-anchor': 'end' }, svg).textContent = fmt(v); }
    x.forEach((lab, i) => { sv('text', { x: px(i), y: H - 8, 'text-anchor': 'middle' }, svg).textContent = lab; });
    const cross = sv('line', { y1: T, y2: H - B, stroke: 'var(--muted)', 'stroke-dasharray': '3 3', visibility: 'hidden' }, svg);
    series.forEach((s, si) => {
      const c = COLORS[si % COLORS.length]; let d = '';
      s.values.forEach((v, i) => { if (v == null) return; d += (d && s.values[i - 1] != null ? 'L' : 'M') + px(i) + ' ' + py(v); });
      sv('path', { d, fill: 'none', stroke: c, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
      s.values.forEach((v, i) => { if (v != null) sv('circle', { cx: px(i), cy: py(v), r: 4, fill: c, stroke: 'var(--sheet)', 'stroke-width': 2 }, svg); });
    });
    const hit = sv('rect', { x: L - 20, y: 0, width: W - L - R + 40, height: H, fill: 'transparent' }, svg);
    const move = e => {
      const p = local(svg, card, e, W);
      let i = Math.round((p.vx - L) / ((W - L - R) / Math.max(1, x.length - 1))); i = Math.max(0, Math.min(x.length - 1, i));
      cross.setAttribute('x1', px(i)); cross.setAttribute('x2', px(i)); cross.setAttribute('visibility', 'visible');
      showTip(tip, card, x[i], series.map((s, si) => ({ name: s.name, color: COLORS[si % COLORS.length], value: fmt(s.values[i], ch.unit) })), p.cx, p.cy);
    };
    hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
    return svg;
  }
  function barChart(ch, series, tip, card) {   // horizontal bars from zero; negatives go left
    const cats = ch.categories || [], n = series.length, bh = n > 1 ? 9 : 14, gap = 2, row = n * bh + (n - 1) * gap + 10;
    const W = 560, L = ch.labelWidth || 150, R = 46, T = 6, B = 22, H = T + B + cats.length * row;
    const all = series.flatMap(s => s.values).filter(v => v != null).concat(0);
    let mn = Math.min(...all), mx = Math.max(...all);
    if (ch.labels) { const pad = (mx - mn) * 0.18; if (mn < 0) mn -= pad; if (mx > 0) mx += pad; }   // room for value labels
    const tk = ticks(mn, mx, 4), lo = tk[0], hi = tk[tk.length - 1];
    const px = v => L + (v - lo) * (W - L - R) / (hi - lo);
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': ch.title || '' });
    for (const v of tk) { sv('line', { x1: px(v), x2: px(v), y1: T, y2: H - B, stroke: 'var(--grid)' }, svg); sv('text', { x: px(v), y: H - 6, 'text-anchor': 'middle' }, svg).textContent = fmt(v); }
    sv('line', { x1: px(0), x2: px(0), y1: T, y2: H - B, stroke: 'var(--muted)' }, svg);
    cats.forEach((c, ci) => {
      const y0 = T + ci * row + 5;
      sv('text', { x: L - 8, y: y0 + (row - 10) / 2 + 4, 'text-anchor': 'end' }, svg).textContent = c;
      series.forEach((s, si) => {
        const v = s.values[ci]; if (v == null) return;
        const y = y0 + si * (bh + gap), a = px(Math.min(0, v)), b = px(Math.max(0, v)), w = Math.max(1, b - a), rr = Math.min(4, w / 2, bh / 2);
        // round only the data end, keep the zero end square
        const d = v >= 0
          ? `M${a} ${y}H${a + w - rr}Q${a + w} ${y} ${a + w} ${y + rr}V${y + bh - rr}Q${a + w} ${y + bh} ${a + w - rr} ${y + bh}H${a}Z`
          : `M${b} ${y}H${a + rr}Q${a} ${y} ${a} ${y + rr}V${y + bh - rr}Q${a} ${y + bh} ${a + rr} ${y + bh}H${b}Z`;
        const color = COLORS[si % COLORS.length];
        const bar = sv('path', { d, fill: color }, svg);
        if (ch.labels) { const t = sv('text', { class: 'val', x: v >= 0 ? b + 4 : a - 4, y: y + bh / 2 + 4, 'text-anchor': v >= 0 ? 'start' : 'end' }, svg); t.textContent = (v > 0 ? '+' : '') + fmt(v, ch.unit); }
        const hit = sv('rect', { x: L, y: y0 - 4, width: W - L, height: row - 2, fill: 'transparent' }, svg);
        const show = e => { const p = local(svg, card, e, W); showTip(tip, card, c, series.map((s2, k) => ({ name: s2.name, color: COLORS[k % COLORS.length], value: fmt(s2.values[ci], ch.unit) })), p.cx, p.cy); };
        if (si === 0) { hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', () => { tip.hidden = true; }); }
        else hit.remove();
        bar.style.pointerEvents = 'none';
      });
    });
    return svg;
  }
  $('refreshBtn').addEventListener('click', loadList);

  const saved = store.get();
  if (saved) connect(saved, false, true);
})();
