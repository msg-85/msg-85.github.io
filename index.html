<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>데이터 창구</title>
<style>
/* This page holds no data. Everything it shows comes from the private repo, using the viewer's own token. */
:root {
  --bg: #eef2f0; --panel: #fbfcfb; --sheet: #ffffff; --head: #e3e9e6;
  --line: #d2dad6; --fg: #17211d; --muted: #5b6a63;
  --in: #0f6b4f; --out: #3a4fb0; --warn: #a3341f; --on-accent: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --grid: #e6ebe8;
  --sans: "Malgun Gothic", "Segoe UI", sans-serif;
  --mono: Consolas, "Malgun Gothic", monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121715; --panel: #181f1c; --sheet: #1c2421; --head: #252e2a;
  --line: #333f3a; --fg: #e6ece9; --muted: #98a7a0;
  --in: #4fc29b; --out: #9aa9f2; --warn: #f09a86; --on-accent: #10231c; color-scheme: dark;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --grid: #2a3430;
} }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); padding: 12px 16px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--in); outline-offset: 1px; }
a { color: var(--out); }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); gap: 10px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.top h1 { font-size: 18px; font-weight: 700; margin: 0; }
.tabs { display: flex; gap: 4px; }
.tab { border: 1px solid var(--line); background: var(--panel); padding: 4px 14px; cursor: pointer; font-weight: 600; }
.tab[aria-selected="true"] { background: var(--in); border-color: var(--in); color: var(--on-accent); }
#tabIn[aria-selected="true"] { background: var(--out); border-color: var(--out); }
#tabAna[aria-selected="true"] { background: var(--s3); border-color: var(--s3); color: #fff; }
.who { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }

.pane { background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; padding: 12px; min-height: 0; min-width: 0; }
.login { max-width: 640px; width: 100%; margin: 0 auto; align-self: start; }
.login h2 { font-size: 17px; margin: 0; }
.login ol { margin: 0; padding-left: 20px; }
.login p { margin: 0; }
.drop { flex: 1; min-height: 180px; width: 100%; resize: none; border: 2px dashed var(--line); background: var(--sheet); padding: 18px; text-align: center; }
.drop::placeholder { color: var(--muted); }
.drop:focus { border-color: var(--in); outline: none; }
body.dragging .drop { border-color: var(--out); }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input { border: 1px solid var(--line); background: var(--sheet); padding: 6px 8px; color: var(--fg); width: 100%; font-size: 15px; }
.check { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .grow { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--sheet); padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--head); }
.btn.small { padding: 1px 8px; font-size: 13px; }
.btn.primary { background: var(--in); border-color: var(--in); color: var(--on-accent); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.next { background: var(--sheet); border: 1px solid var(--in); padding: 8px 12px; margin: 0; }
.err { color: var(--warn); margin: 0; font-size: 14px; }
progress { width: 100%; height: 10px; accent-color: var(--in); }
.list { display: flex; flex-direction: column; gap: 4px; max-height: 30%; overflow-y: auto; flex-shrink: 0; }
.item { text-align: left; font: 13px var(--mono); }
.item[aria-current="true"] { border-color: var(--out); }
.dh h2 { font-size: 17px; margin: 0; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.note { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sheet); border: 1px solid var(--line); padding: 10px 12px; max-height: 38%; overflow-y: auto; flex-shrink: 0; }

.grid { flex: 1; min-height: 120px; overflow: auto; border: 1px solid var(--line); background: var(--sheet); }
table { border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 2px 8px; white-space: pre; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
thead th { position: sticky; top: 0; background: var(--head); font: 500 12px var(--mono); color: var(--muted); z-index: 2; text-align: center; }
tbody th { position: sticky; left: 0; background: var(--head); font: 500 12px var(--mono); color: var(--muted); z-index: 1; text-align: right; }
thead th:first-child { left: 0; z-index: 3; }
td.num { text-align: right; font-family: var(--mono); }

/* reply views */
.sub { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.sub button { border: 0; border-bottom: 3px solid transparent; background: none; padding: 6px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.sub button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--out); }
.view { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.view > .grid { min-height: 240px; }
.empty { color: var(--muted); margin: 0; padding: 16px 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.kpi { background: var(--sheet); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.kpi .k { font-size: 13px; color: var(--muted); }
.kpi .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .d { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 10px; }
.card { position: relative; background: var(--sheet); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card h3 { font-size: 15px; margin: 0; }
.card .cn { font-size: 13px; color: var(--muted); margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.box { height: 10px; }
.card svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.card svg text { fill: var(--muted); font: 11px var(--sans); }
.card svg .val { fill: var(--fg); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.15); padding: 6px 9px; font-size: 13px; white-space: nowrap; z-index: 5; font-variant-numeric: tabular-nums; }
.tip b { display: block; margin-bottom: 2px; }
.tip div { display: flex; align-items: center; gap: 6px; }
.tip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.tip em { font-style: normal; margin-left: auto; padding-left: 12px; font-weight: 600; }
.summary { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid var(--out); padding: 10px 12px; margin: 0; white-space: pre-wrap; }
.items { display: grid; gap: 8px; }
.items article { background: var(--sheet); border: 1px solid var(--line); padding: 10px 12px; }
.items h3 { font-size: 15px; margin: 0 0 4px; display: flex; gap: 8px; align-items: baseline; }
.items h3 small { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); padding: 0 6px; }
.items p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.files { display: flex; flex-wrap: wrap; gap: 4px; }

/* analysis: selection bar, tables, 판정 chips, puzzles. Everything below is recomputed in the browser from the uploaded data. */
:root { --bad: #ffd3da; --jr: #fde1e1; --jrf: #a8161b; --jw: #fff1d1; --jwf: #7f4d00; --ju: #e2f3e7; --juf: #1d6a35; --jo: #e6ecfb; --jof: #2c4a9a; --jn: #eee6fa; --jnf: #5a3a9c; --je: #ebebeb; --jef: #4d4d4d; --pos: #1d7a4a; --neg: #c0262d; }
@media (prefers-color-scheme: dark) { :root { --bad: #4d2329; --jr: #4a1f22; --jrf: #ffb3b0; --jw: #47361a; --jwf: #ffd58a; --ju: #1c3a27; --juf: #9fe0b4; --jo: #23304f; --jof: #b6c6ff; --jn: #33284a; --jnf: #d5c2ff; --je: #333; --jef: #ccc; --pos: #6fd39b; --neg: #ff8a8a; } }
.abar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: flex-end; flex-shrink: 0; }
.abar .f { display: flex; flex-direction: column; gap: 1px; font-size: 12px; color: var(--muted); }
.abar .f.row { flex-direction: row; align-items: center; gap: 4px; }
.abar select, .abar input[type=number], .abar input[type=search] { font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); background: var(--sheet); color: var(--fg); }
.abar input[type=number] { width: 64px; }
.abar .sp { flex: 1; }
.ms { position: relative; }
.ms > summary { list-style: none; cursor: pointer; border: 1px solid var(--line); background: var(--sheet); padding: 3px 8px; font-size: 13px; min-width: 96px; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.ms > summary::-webkit-details-marker { display: none; }
.ms.on > summary { border-color: var(--out); color: var(--out); font-weight: 600; }
.msp { position: absolute; z-index: 30; top: calc(100% + 2px); left: 0; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.2); padding: 8px; width: 290px; display: flex; flex-direction: column; gap: 6px; }
.msl { max-height: 300px; overflow: auto; display: flex; flex-direction: column; font-size: 13px; }
.msl label { display: flex; gap: 6px; align-items: center; padding: 1px 2px; color: var(--fg); cursor: pointer; }
.msa { display: flex; gap: 6px; justify-content: flex-end; }
.crumb { font-size: 13px; color: var(--muted); background: var(--sheet); border: 1px solid var(--line); padding: 5px 10px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; flex-shrink: 0; }
.crumb b { color: var(--fg); }
.crumb .x { border: 1px solid var(--line); background: var(--panel); padding: 0 7px; cursor: pointer; font-size: 12px; color: var(--fg); }
.crumb .x:hover { border-color: var(--warn); }
.tw { overflow: auto; border: 1px solid var(--line); background: var(--sheet); flex-shrink: 0; }
.at { width: 100%; font-size: 13px; }
.at th, .at td { white-space: nowrap; max-width: none; padding: 3px 8px; }
.at thead th { font: 600 12px var(--sans); color: var(--fg); background: var(--head); position: sticky; top: 0; }
.at thead th:first-child { left: auto; }
.at tbody th { position: static; font: 600 13px var(--sans); color: var(--fg); text-align: left; background: var(--head); }
.at td.n { text-align: right; font-variant-numeric: tabular-nums; }
.at td.l, .at th.l { text-align: left; }
.at td.it { font-style: italic; color: var(--muted); }
.at td.bad { background: var(--bad); }
.at tr.tot td { font-weight: 700; background: var(--head); }
.at tr.blk th { cursor: pointer; }
.at tr.dr { cursor: pointer; }
.tg { border: 0; background: none; color: var(--muted); cursor: pointer; width: 20px; padding: 0; font-size: 12px; }
.tg:hover { color: var(--fg); }
.tg0 { display: inline-block; width: 20px; }
.at tr.lv1 td { background: color-mix(in srgb, var(--head) 35%, var(--sheet)); }
.at tr.lv2 td { background: color-mix(in srgb, var(--head) 60%, var(--sheet)); }
.at tr.lv3 td { background: var(--head); }
.at tr.lv1 td.bad, .at tr.lv2 td.bad, .at tr.lv3 td.bad { background: var(--bad); }
.at tr.dr:hover td { background: var(--head); }
.at thead th.s { cursor: pointer; }
.neg { color: var(--neg); } .pos { color: var(--pos); }
.j { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.j.red { background: var(--jr); color: var(--jrf); } .j.warn { background: var(--jw); color: var(--jwf); } .j.up { background: var(--ju); color: var(--juf); }
.j.ok { background: var(--jo); color: var(--jof); } .j.new { background: var(--jn); color: var(--jnf); } .j.end { background: var(--je); color: var(--jef); } .j.na { color: var(--muted); }
.ins { display: flex; flex-direction: column; gap: 12px; }
.icard { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid var(--out); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.icard.red { border-left-color: var(--neg); } .icard.warn { border-left-color: #d08a00; } .icard.up, .icard.ok { border-left-color: var(--pos); }
.icard h3 { margin: 0; font-size: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.icard h3 small { font-size: 12px; font-weight: 400; color: var(--muted); }
.icard h4 { margin: 0; font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); padding: 7px 10px; background: var(--panel); }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.tile .d { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.bul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.bul li { line-height: 1.6; }
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.two > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.muted { color: var(--muted); font-size: 12.5px; }
.req { display: flex; flex-direction: column; gap: 8px; }
.req textarea { width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--line); background: var(--sheet); padding: 8px; color: var(--fg); }
.qa { background: var(--sheet); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.qa .q { white-space: pre-wrap; }
.qa .a { border-left: 3px solid var(--out); padding-left: 10px; white-space: pre-wrap; }
details.memo > summary { cursor: pointer; color: var(--muted); }

@media (max-width: 700px) {
  html, body { height: auto; }
  .app { height: auto; }
  .pane { min-height: 70vh; }
  .login { min-height: 0; }
  .fields { grid-template-columns: minmax(0, 1fr); }
}
/* 인쇄: the open reply view only, light colors, cards kept whole */
@media print {
  :root {
    --bg: #ffffff; --panel: #ffffff; --sheet: #ffffff; --head: #eef1ef;
    --line: #c9d1cd; --fg: #111111; --muted: #4f5b55; --out: #3a4fb0; color-scheme: light;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --grid: #e6ebe8;
  }
  @page { size: A4; margin: 10mm; }
  html, body, .app { height: auto; }
  body { padding: 0; background: #fff; font-size: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .top, #readPane > .bar:not(#rHead), #list, #rTabs, #rHead .btn, .tip, .err, #vTable .bar, #vSrc .bar, #sFiles, #aBar, .crumb .x, .req textarea, .req .bar { display: none !important; }
  .tw { overflow: visible; }
  .icard, .tile { break-inside: avoid; }
  .pane { border: 0; padding: 0; gap: 8px; }
  .view { overflow: visible; flex: none; }
  .grid { overflow: visible; max-height: none; }
  .charts { grid-template-columns: 1fr 1fr; }
  .kpis { grid-template-columns: repeat(3, 1fr); }
  .kpi, .card, .items article, .summary { break-inside: avoid; }
}
</style>

<div class="app">
  <header class="top">
    <h1>데이터 창구</h1>
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" id="tabOut" role="tab" type="button" aria-selected="true">보내기</button>
      <button class="tab" id="tabIn" role="tab" type="button" aria-selected="false">답장 보기</button>
      <button class="tab" id="tabAna" role="tab" type="button" aria-selected="false">분석표</button>
    </div>
    <span class="who" id="who" hidden>연결됨 <button class="btn small" id="logoutBtn" type="button">연결 끊기</button></span>
  </header>

  <section class="pane login" id="loginPane">
    <h2>열쇠로 연결하기</h2>
    <ol>
      <li><a href="https://github.com/settings/personal-access-tokens/new?name=data-window&amp;description=Data%20window%20page&amp;target_name=msg-85&amp;expires_in=90&amp;contents=write" target="_blank" rel="noopener noreferrer">GitHub 열쇠 만들기 화면</a>을 엽니다.</li>
      <li><b>Repository access</b>에서 <b>Only select repositories</b>를 고르고 <b>price-data</b>만 선택합니다.</li>
      <li><b>Contents</b>가 <b>Read and write</b>인지 확인하고 <b>Generate token</b>을 누릅니다.</li>
      <li>나온 열쇠(<code>github_pat_</code>로 시작)를 복사해 아래에 붙여넣습니다.</li>
    </ol>
    <label class="field">열쇠<input id="token" type="password" autocomplete="off" spellcheck="false"></label>
    <label class="check"><input id="remember" type="checkbox"> 이 브라우저에 기억하기 (혼자 쓰는 컴퓨터에서만)</label>
    <div class="bar">
      <span class="grow">열쇠는 GitHub에만 전달됩니다. 디스코드나 대화창에는 보내지 마세요.</span>
      <button class="btn primary" id="loginBtn" type="button">연결</button>
    </div>
    <p class="err" id="loginErr" hidden></p>
  </section>

  <section class="pane" id="sendPane" hidden>
    <textarea class="drop" id="drop" aria-label="엑셀 데이터 붙여넣기" placeholder="엑셀에서 셀을 복사해 여기에 붙여넣거나, 파일을 이 창에 끌어다 놓으세요."></textarea>
    <div class="grid" id="draftGrid" hidden></div>
    <div class="fields">
      <label class="field">제목<input id="title" type="text" maxlength="80" placeholder="예: 2024-2026 판매가"></label>
      <label class="field">Claude에게 요청 (선택)<input id="note" type="text" maxlength="2000" placeholder="예: 품목별 월평균을 내주고 이상한 값을 찾아줘"></label>
    </div>
    <progress id="prog" max="1" value="0" hidden></progress>
    <div class="bar">
      <span class="grow" id="draftInfo">표를 붙여넣거나 파일을 고르면 올릴 수 있습니다.</span>
      <input id="upIn" type="file" multiple hidden>
      <button class="btn" id="clearBtn" type="button" hidden>지우기</button>
      <button class="btn" id="upPick" type="button">파일 선택</button>
      <button class="btn primary" id="sendBtn" type="button" disabled>올리기</button>
    </div>
    <p class="next" id="saved" hidden></p>
    <p class="err" id="sendErr" hidden></p>
  </section>

  <section class="pane" id="readPane" hidden>
    <div class="bar">
      <span class="grow" id="listInfo"></span>
      <button class="btn" id="refreshBtn" type="button">새로고침</button>
    </div>
    <div class="list" id="list"></div>
    <div class="dh bar" id="rHead" hidden><h2 id="rTitle"></h2><button class="btn" id="printBtn" type="button">인쇄</button><button class="btn primary" id="xlsxBtn" type="button">엑셀로 내려받기</button><button class="btn" id="linkedBtn" type="button" hidden>연동형 엑셀 받기</button><button class="btn" id="reportBtn" type="button" hidden>보고서 받기 (pptx)</button></div>
    <div class="sub" role="tablist" id="rTabs" hidden>
      <button type="button" role="tab" data-v="vNote" data-m="reply">답장</button>
      <button type="button" role="tab" data-v="vSum" data-m="ana">요약표</button>
      <button type="button" role="tab" data-v="vJudge" data-m="ana">판정표</button>
      <button type="button" role="tab" data-v="vIns" data-m="ana">INSIGHT</button>
      <button type="button" role="tab" data-v="vReq" data-m="ana">요청 · 추가 분석</button>
      <button type="button" role="tab" data-v="vTable" data-m="reply">결과표</button>
      <button type="button" role="tab" data-v="vSrc" data-m="reply ana">올린 데이터</button>
    </div>
    <div class="view" id="vNote" hidden></div>
    <div class="abar" id="aBar" hidden></div>
    <div class="crumb" id="aCrumb" hidden></div>
    <div class="view" id="vSum" hidden></div>
    <div class="view" id="vJudge" hidden></div>
    <div class="view" id="vIns" hidden></div>
    <div class="view" id="vReq" hidden></div>
    <div class="view" id="vTable" hidden>
      <div class="grid" id="rGrid" hidden></div>
      <div class="bar">
        <span class="grow" id="rInfo"></span>
        <button class="btn primary" id="copyBtn" type="button" hidden>표 복사 (엑셀에 붙여넣기용)</button>
      </div>
    </div>
    <div class="view" id="vSrc" hidden>
      <p class="cn" id="sNote" hidden></p>
      <div class="files" id="sFiles"></div>
      <div class="grid" id="sGrid" hidden></div>
      <div class="bar">
        <span class="grow" id="sInfo"></span>
        <button class="btn primary" id="sCopy" type="button" hidden>표 복사 (엑셀에 붙여넣기용)</button>
      </div>
    </div>
    <p class="err" id="rErr" hidden></p>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const REPO = '/repos/msg-85/price-data';
  const PART = 8 * 1024 * 1024;              // bytes of compressed data per uploaded piece
  const MAX_ROWS = 500, MAX_CELLS = 30000;   // on-screen preview only
  const KEY = 'data-window-token';
  let token = '', draft = null, files = [], reply = null, busy = false;

  // ---------- storage: may be unavailable, so never let it stop the page ----------
  const store = {
    get() { for (const s of ['sessionStorage', 'localStorage']) { try { const v = window[s].getItem(KEY); if (v) return v; } catch (e) {} } return ''; },
    set(v, keep) { try { window[keep ? 'localStorage' : 'sessionStorage'].setItem(KEY, v); } catch (e) {} },
    clear() { for (const s of ['sessionStorage', 'localStorage']) { try { window[s].removeItem(KEY); } catch (e) {} } },
  };

  // ---------- GitHub ----------
  class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
  async function api(path, opts = {}) {
    const res = await fetch('https://api.github.com' + REPO + path, {
      cache: 'no-store', ...opts,
      headers: { Authorization: 'Bearer ' + token, Accept: opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
    });
    if (!res.ok) {
      let msg = ''; try { msg = (await res.json()).message || ''; } catch (e) {}
      throw new ApiError(res.status, msg);
    }
    return res;
  }
  function explain(e) {
    if (e.status === 401) return '열쇠가 맞지 않거나 기간이 끝났습니다. 연결을 끊고 새 열쇠로 다시 연결해 주세요.';
    if (e.status === 403) return '이 열쇠에 쓰기 권한이 없습니다. Contents가 Read and write인지 확인해 주세요.';
    if (e.status === 404) return '저장소를 찾지 못했습니다. 열쇠를 만들 때 price-data를 선택했는지 확인해 주세요.';
    if (e instanceof TypeError) return 'GitHub에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.';
    return 'GitHub 오류입니다: ' + (e.status || '') + ' ' + e.message;
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function toBase64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  // Commits happen one at a time, so a retry after a dropped reply can find the file already there.
  async function put(path, base64, message) {
    const body = JSON.stringify({ message, content: base64 });
    for (let attempt = 0; ; attempt++) {
      try { await api('/contents/' + path, { method: 'PUT', body }); return; }
      catch (e) {
        if (e.status === 422 && attempt > 0) return;
        const retry = e instanceof TypeError || e.status === 409 || e.status === 429 || e.status >= 500;
        if (!retry || attempt >= 4) throw e;
        await wait(2000 * 2 ** attempt);
      }
    }
  }

  // ---------- login ----------
  async function connect(t, keep, quiet) {
    token = t; $('loginBtn').disabled = true; $('loginErr').hidden = true;
    try {
      await api('');
      store.set(t, keep);
      $('token').value = '';
      $('loginPane').hidden = true; $('tabs').hidden = false; $('who').hidden = false;
      tab('send');
    } catch (e) {
      token = ''; if (e.status === 401) store.clear();
      if (!quiet || e.status !== 401) { $('loginErr').textContent = explain(e); $('loginErr').hidden = false; }
    }
    $('loginBtn').disabled = false;
  }
  $('loginBtn').addEventListener('click', () => { const t = $('token').value.trim(); if (t) connect(t, $('remember').checked); });
  $('token').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('logoutBtn').addEventListener('click', () => {
    if (busy) return;
    store.clear(); token = '';
    $('sendPane').hidden = true; $('readPane').hidden = true; $('tabs').hidden = true; $('who').hidden = true;
    $('loginPane').hidden = false;
  });

  // ---------- tabs ----------
  // 'read' = replies (outbox/*.txt: 답장 · 결과표 · 올린 데이터); 'ana' = 분석표 (analysis/*.json: in-browser analysis of an upload)
  let mode = 'read';
  function tab(name) {
    const send = name === 'send';
    $('sendPane').hidden = !send; $('readPane').hidden = send;
    $('tabOut').setAttribute('aria-selected', String(send));
    $('tabIn').setAttribute('aria-selected', String(name === 'read'));
    $('tabAna').setAttribute('aria-selected', String(name === 'ana'));
    if (send) return;
    if (mode !== name || !cur) {
      mode = name; cur = null; AS = null; srcState = null; openToken++;
      $('rHead').hidden = true; $('rTabs').hidden = true; $('aBar').hidden = true; $('aCrumb').hidden = true;
      for (const v of VIEWS) $(v).hidden = true;
    }
    loadList();
  }
  $('tabOut').addEventListener('click', () => tab('send'));
  $('tabIn').addEventListener('click', () => tab('read'));
  $('tabAna').addEventListener('click', () => tab('ana'));

  // ---------- table helpers ----------
  const clean = t => t.replace(/^﻿/, '').replace(/\r\n?/g, '\n').replace(/\n+$/, '');
  function split(text, d) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"' && cell === '') q = true;
      else if (c === d) { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    row.push(cell); rows.push(row);
    return q ? text.split('\n').map(l => l.split(d)) : rows;   // a stray quote: read it literally
  }
  function parse(text) {
    const first = text.split('\n', 1)[0];
    const d = text.includes('\t') || !first.includes(',') ? '\t' : ',';
    const rows = split(text, d);
    return { rows, delim: d, cols: rows.reduce((m, r) => Math.max(m, r.length), 0) };
  }
  // Reply file: optional "#TITLE:" and "#NOTE:" lines (note newlines written as \n), then the table.
  function readFile(text) {
    let body = clean(text), title = '', note = '', m;
    while ((m = /^#(TITLE|NOTE): ?(.*)(\n|$)/.exec(body))) {
      if (m[1] === 'TITLE') title = m[2]; else note = m[2].replace(/\\n/g, '\n');
      body = body.slice(m[0].length);
    }
    return { title, note, body };
  }
  const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; };
  const isNum = v => /^-?[\d,]*\.?\d+%?$/.test(v);
  function drawGrid(host, t) {
    const shown = Math.min(t.rows.length, MAX_ROWS, Math.max(1, Math.floor(MAX_CELLS / Math.max(1, t.cols))));
    const table = document.createElement('table');
    const head = table.createTHead().insertRow();
    head.appendChild(document.createElement('th'));
    for (let c = 0; c < t.cols; c++) { const th = document.createElement('th'); th.textContent = colName(c); head.appendChild(th); }
    const body = table.createTBody();
    for (let r = 0; r < shown; r++) {
      const tr = body.insertRow();
      const th = document.createElement('th'); th.textContent = r + 1; tr.appendChild(th);
      for (let c = 0; c < t.cols; c++) {
        const v = t.rows[r][c] ?? '', td = tr.insertCell();
        td.textContent = v; if (isNum(v)) td.className = 'num';
      }
    }
    host.replaceChildren(table); host.scrollTop = 0; host.scrollLeft = 0; host.hidden = false;
    return shown;
  }
  const mb = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + 'MB';

  // ---------- choosing what to send ----------
  function ready() {
    $('sendBtn').disabled = busy || !(draft || files.length);
    $('clearBtn').hidden = !(draft || files.length);
    $('saved').hidden = true; $('sendErr').hidden = true;
  }
  function takePaste(text) {
    const raw = clean(text);
    if (!raw || busy) return;
    files = []; draft = { raw, ...parse(raw) };
    const shown = drawGrid($('draftGrid'), draft);
    $('drop').hidden = true;
    $('draftInfo').textContent = `${draft.rows.length.toLocaleString()}행 × ${draft.cols}열` +
      (shown < draft.rows.length ? ` · 미리보기는 ${shown}행까지, 올릴 때는 전체가 올라갑니다` : '');
    ready(); $('title').focus();
  }
  function takeFiles(list) {
    if (busy || !list.length) return;
    draft = null; files = [...list];
    $('draftGrid').hidden = true; $('draftGrid').replaceChildren(); $('drop').hidden = false;
    const total = files.reduce((s, f) => s + f.size, 0);
    $('draftInfo').textContent = `파일 ${files.length}개 · ${mb(total)} · ` + files.map(f => f.name).join(', ');
    ready();
  }
  function clearDraft() {
    if (busy) return;
    draft = null; files = [];
    $('draftGrid').hidden = true; $('draftGrid').replaceChildren();
    $('drop').hidden = false; $('drop').value = '';
    $('draftInfo').textContent = '표를 붙여넣거나 파일을 고르면 올릴 수 있습니다.';
    ready();
  }

  // ---------- upload ----------
  // A file is read, gzipped and sent piece by piece, so a 300MB file never sits in memory whole.
  // manifest.json goes last: a folder without one is an upload that did not finish.
  async function sendOne(file, index, stamp, onProgress) {
    let read = 0;
    const counted = file.stream().pipeThrough(new TransformStream({
      transform(c, ctl) { read += c.byteLength; ctl.enqueue(c); },
    }));
    const reader = counted.pipeThrough(new CompressionStream('gzip')).getReader();
    const parts = []; let buf = new Uint8Array(PART), used = 0, stored = 0;
    const flush = async () => {
      if (!used) return;
      const name = `f${index + 1}-${String(parts.length + 1).padStart(4, '0')}.gz`;
      await put(`inbox/${stamp}/${name}`, toBase64(buf.subarray(0, used)), `upload ${stamp} ${name}`);
      parts.push(name); stored += used; used = 0;
      onProgress(read, parts.length);
    };
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      let at = 0;
      while (at < value.length) {
        const n = Math.min(PART - used, value.length - at);
        buf.set(value.subarray(at, at + n), used);
        used += n; at += n;
        if (used === PART) await flush();
      }
      onProgress(read, parts.length);
    }
    await flush();
    return { name: file.name, size: file.size, gzipBytes: stored, parts };
  }
  async function send() {
    if (busy || !(draft || files.length)) return;
    if (!('CompressionStream' in window)) { $('sendErr').textContent = '이 브라우저는 너무 오래돼서 올리기를 지원하지 않습니다. 최신 Chrome이나 Edge를 써주세요.'; $('sendErr').hidden = false; return; }
    const p2 = n => String(n).padStart(2, '0'), d = new Date();
    const stamp = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
    const list = draft ? [new File([draft.raw], 'paste.tsv', { type: 'text/tab-separated-values' })] : files;
    const total = list.reduce((s, f) => s + f.size, 0) || 1;
    busy = true; $('sendBtn').disabled = true; $('upPick').disabled = true; $('clearBtn').disabled = true;
    $('saved').hidden = true; $('sendErr').hidden = true; $('prog').hidden = false; $('prog').value = 0;
    try {
      const out = []; let before = 0;
      for (let i = 0; i < list.length; i++) {
        out.push(await sendOne(list[i], i, stamp, (read, n) => {
          $('prog').value = (before + read) / total;
          $('draftInfo').textContent = `${list[i].name} 올리는 중 · ${mb(before + read)} / ${mb(total)} · 이 창을 닫지 마세요`;
        }));
        before += list[i].size;
      }
      const manifest = { title: $('title').value.trim(), note: $('note').value.trim(), createdAt: d.toISOString(), files: out };
      const json = new TextEncoder().encode(JSON.stringify(manifest, null, 2));
      await put(`inbox/${stamp}/manifest.json`, toBase64(json), `upload ${stamp} done`);
      const kept = out.reduce((s, f) => s + f.gzipBytes, 0);
      busy = false; $('clearBtn').disabled = false; clearDraft();
      $('title').value = ''; $('note').value = '';
      $('saved').textContent = `올렸습니다. ${mb(total)}를 ${mb(kept)}로 압축했습니다. 번호 ${stamp}를 Claude에게 알려주시면 바로 읽습니다.`;
      $('saved').hidden = false;
    } catch (e) {
      busy = false; $('clearBtn').disabled = false; $('sendBtn').disabled = false;
      $('sendErr').textContent = '올리지 못했습니다. ' + explain(e) + ' 다시 올리면 처음부터 새로 올라갑니다.';
      $('sendErr').hidden = false;
    }
    $('upPick').disabled = false; $('prog').hidden = true;
  }
  document.addEventListener('paste', e => {
    if (!token) return;
    const t = e.target;
    if (t.tagName === 'INPUT' || (t.tagName === 'TEXTAREA' && t.id !== 'drop')) return;
    const text = e.clipboardData && e.clipboardData.getData('text/plain');
    if (text) { e.preventDefault(); tab('send'); takePaste(text); }
  });
  $('drop').addEventListener('input', () => { const v = $('drop').value; if (v) { $('drop').value = ''; takePaste(v); } });
  $('clearBtn').addEventListener('click', clearDraft);
  $('sendBtn').addEventListener('click', send);
  $('upPick').addEventListener('click', () => $('upIn').click());
  $('upIn').addEventListener('change', e => { takeFiles(e.target.files); e.target.value = ''; });
  window.addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', e => {
    e.preventDefault(); document.body.classList.remove('dragging');
    if (token && e.dataTransfer && e.dataTransfer.files.length) { tab('send'); takeFiles(e.dataTransfer.files); }
  });

  // ---------- replies ----------
  async function loadList() {
    $('listInfo').textContent = '불러오는 중입니다.'; $('rErr').hidden = true;
    const ana = mode === 'ana', none = ana ? '아직 분석표가 없습니다. 디스코드에 "번호 ○○ 분석표로 분석해줘"라고 보내주세요.' : '아직 답장이 없습니다.';
    try {
      const items = await (await api(ana ? '/contents/analysis' : '/contents/outbox')).json();
      if (ana !== (mode === 'ana')) return;
      const names = items.filter(i => i.type === 'file' && i.name.endsWith(ana ? '.json' : '.txt')).map(i => i.name).sort().reverse();
      if (!ana) outFiles = new Set(items.filter(i => i.type === 'file').map(i => i.name));
      $('list').replaceChildren(...names.map(name => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'btn item'; b.dataset.name = name; b.textContent = ana ? name.replace(/\.json$/, '') : name;
        if (cur && cur.name === name) b.setAttribute('aria-current', 'true');
        b.addEventListener('click', () => (ana ? openAna : openReply)(name, b));
        return b;
      }));
      $('listInfo').textContent = names.length ? (ana ? `분석표 ${names.length}개` : `답장 ${names.length}개`) : none;
      if (ana) for (const b of $('list').children) loadAnaTitle(b);
    } catch (e) {
      $('list').replaceChildren();
      if (e.status === 404) { $('listInfo').textContent = none; return; }
      $('listInfo').textContent = ''; $('rErr').textContent = explain(e); $('rErr').hidden = false;
    }
  }
  // A reply is <name>.txt (title, note, result table) plus an optional <name>.json beside it:
  // { source, summary, kpis:[{label,value,delta}], charts:[{type:'line'|'bar',title,note,unit,x|categories,series:[{name,values}]}],
  //   items:[{title,tag,body}] }. Without the JSON, the note is split into items and there is no dashboard.
  let openToken = 0, srcState = null, cur = null, outFiles = new Set();
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  async function openReply(name, button) {
    const my = ++openToken;
    $('rErr').hidden = true; $('listInfo').textContent = '여는 중입니다.';
    for (const b of $('list').children) b.removeAttribute('aria-current');
    button.setAttribute('aria-current', 'true');
    try {
      const res = await api('/contents/outbox/' + encodeURIComponent(name), { accept: 'application/vnd.github.raw+json' });
      const f = readFile(await res.text());
      let extra = null;
      try {
        const j = await api('/contents/outbox/' + encodeURIComponent(name.replace(/\.txt$/, '.json')), { accept: 'application/vnd.github.raw+json' });
        extra = JSON.parse(await j.text());
      } catch (e) { if (e.status !== 404 && !(e instanceof SyntaxError)) throw e; }
      if (my !== openToken) return;
      $('listInfo').textContent = '';
      $('rHead').hidden = false; $('rTitle').textContent = f.title || name;
      $('rTabs').hidden = false;
      drawTable(f.body);
      cur = { name, title: f.title || name.replace(/\.txt$/, ''), note: f.note, body: f.body, extra };
      $('xlsxBtn').textContent = '엑셀로 내려받기'; $('xlsxBtn').disabled = false;
      for (const [id, ext, label] of EXTRA_FILES) { const b = $(id), fn = name.replace(/\.txt$/, ext); b.hidden = !outFiles.has(fn); b.dataset.file = fn; b.textContent = label; b.disabled = false; }
      const m =/^(\d{8}-\d{6})/.exec(name);
      srcState = { stamp: (extra && extra.source) || (m && m[1]) || '', loaded: false };
      $('sFiles').replaceChildren(); $('sGrid').hidden = true; $('sCopy').hidden = true; $('sNote').hidden = true; $('sInfo').textContent = '';
      AS = null; reqState = null; showTabs('reply');
      view('vNote');
    } catch (e) { $('listInfo').textContent = ''; $('rErr').textContent = explain(e); $('rErr').hidden = false; }
  }
  // 분석표: analysis/<name>.json = { title, source: '<inbox stamp>', note?, createdAt, analysis?: {unit, split, merge, filt} }
  const anaCache = new Map();
  function anaEntry(name) {
    if (!anaCache.has(name)) {
      const p = api('/contents/analysis/' + encodeURIComponent(name), { accept: 'application/vnd.github.raw+json' }).then(r => r.text()).then(JSON.parse);
      p.catch(() => anaCache.delete(name)); anaCache.set(name, p);
    }
    return anaCache.get(name);
  }
  function loadAnaTitle(b) {
    const name = b.dataset.name;
    anaEntry(name).then(j => { if (j.title) b.textContent = `${j.title} · ${name.replace(/\.json$/, '')}`; }, () => {});
  }
  async function openAna(name, button) {
    const my = ++openToken;
    $('rErr').hidden = true; $('listInfo').textContent = '여는 중입니다.';
    for (const b of $('list').children) b.removeAttribute('aria-current');
    button.setAttribute('aria-current', 'true');
    try {
      const j = await anaEntry(name);
      if (my !== openToken) return;
      const stamp = j.source || (/^(\d{8}-\d{6})/.exec(name) || [])[1] || '';
      $('listInfo').textContent = '';
      $('rHead').hidden = false; $('rTitle').textContent = j.title || name.replace(/\.json$/, '');
      drawTable('');
      cur = { name, title: j.title || name.replace(/\.json$/, ''), note: j.note || '', body: '', extra: j, ana: true };
      $('xlsxBtn').textContent = '엑셀로 내려받기'; $('xlsxBtn').disabled = false;
      for (const [id] of EXTRA_FILES) $(id).hidden = true;
      srcState = { stamp, loaded: false };
      $('sFiles').replaceChildren(); $('sGrid').hidden = true; $('sCopy').hidden = true; $('sNote').hidden = true; $('sInfo').textContent = '';
      reqState = null; showTabs('ana'); startAnalysis(cur, srcState);
      view(AVIEWS.includes(curView) || curView === 'vReq' ? curView : 'vSum');
    } catch (e) { $('listInfo').textContent = ''; $('rErr').textContent = explain(e); $('rErr').hidden = false; }
  }
  function showTabs(m) {
    $('rTabs').hidden = false;
    for (const b of $('rTabs').children) b.hidden = !b.dataset.m.split(' ').includes(m);
  }
  function drawNote() {
    const c = cur, host = $('vNote'); if (!c) return;
    host.innerHTML = c.note ? `<p class="summary">${esc(c.note)}</p>` : '<p class="muted">이 답장에는 메모가 없습니다. 결과표 탭을 보세요.</p>';
  }
  const AVIEWS = ['vSum', 'vJudge', 'vIns'], VIEWS = ['vNote', 'vSum', 'vJudge', 'vIns', 'vReq', 'vTable', 'vSrc'];
  let curView = 'vSum';

    const kidsOf = r => { const rest = r._dl || dl; if (!rest.length || r.other) return null; const d = rest[0], gs = lim(groupsOf(C, r.leaves, d)); for (const g of gs) { g._dl = rest.slice(1); g._path = (r._path || [[I.dim, r.code]]).concat(g.other ? [] : [[d, g.code]]); } return { rows: gs }; };
    const cells = g => { const t = g.s, dc = M.has.C ? t.dc : t.dv; return `<td>${g.other ? '' : chip(t.k)}</td><td class="n">${fN(t.S0)}→${fN(t.S1)} <span class="${sg(t.gS)}">(${fG(t.gS)})</span></td><td class="n${isBad(dc) ? ' bad' : ''}">${fP(M.has.C ? t.c0 : t.v0)}→${fP(M.has.C ? t.c1 : t.v1)}</td><td class="n">${fN(t.M0)}→${fN(t.M1)} <span class="${sg(t.dM)}">(${fD(t.dM)})</span></td><td class="n ${sg(t.eS)}">${fD(t.eS)}</td>${M.has.C ? `<td class="n ${sg(t.eC)}">${fD(t.eC)}</td>` : ''}${M.has.V ? `<td class="n ${sg(t.eV)}">${fD(t.eV)}</td>` : ''}`; };
    const nameOf = g => g.other ? esc(g.name) : `<a href="#" data-drill="${(g._path || [[I.dim, g.code]]).map(x => x.join(':')).join(';')}">${esc(g.name)}</a>`;
    const tops = lim(I.subs);
    const levels = dl.length ? `${esc(I.dn)} → ${dl.map(d => esc(M.dims[d])).join(' → ')}` : esc(I.dn);
    let h = `<h4>${esc(I.dn)}별 매출 · CM 기여 <small class="muted">${levels} · CM 변화 큰 순 · 이름 클릭 = 그 항목만 보기</small>${dl.length ? ' <button type="button" class="btn small" data-tall="1">모두 펼치기</button> <button type="button" class="btn small" data-tall="0">모두 접기</button>' : ''}</h4><div class="tw"><table class="at"><thead><tr><th class="l">${esc(I.dn)}</th><th>판정</th><th>매출</th><th>${costName()}</th><th>CM</th><th>매출효과</th>${M.has.C ? '<th>비용율효과</th>' : ''}${M.has.V ? '<th>원가율효과</th>' : ''}</tr></thead><tbody>`;
    h += treeRowsHtml(tops, 0, null, kidsOf, cells, g => nameOf(g));
    return h + '</tbody></table></div>';
  }
  // expand / collapse in place
  function setOpen(tbody, id, open) {
    const tr = tbody.querySelector(`tr[data-t="${id}"]`), b = tr && tr.querySelector('.tg'); if (!b) return;
    b.textContent = open ? '▾' : '▸'; b.setAttribute('aria-expanded', String(open));
    for (const c of tbody.querySelectorAll(`tr[data-tp="${id}"]`)) { c.hidden = !open; if (!open) setOpen(tbody, c.dataset.t, false); }
  }
  $('vIns').addEventListener('click', e => {
    const tg = e.target.closest('.tg');
    if (tg) { const tr = tg.closest('tr'); setOpen(tr.parentNode, tr.dataset.t, tg.getAttribute('aria-expanded') !== 'true'); return; }
    const all = e.target.closest('[data-tall]');
    if (all) {
      const tb = all.closest('h4').nextElementSibling; const table = (tb.matches('.tw') ? tb : tb.nextElementSibling).querySelector('tbody');
      const open = all.dataset.tall === '1';
      for (const tr of table.querySelectorAll('tr[data-t]')) { if (open) { tr.hidden = false; const b = tr.querySelector('.tg'); if (b) { b.textContent = '▾'; b.setAttribute('aria-expanded', 'true'); } } else if (!tr.dataset.tp) setOpen(table, tr.dataset.t, false); }
    }
  });
  // puzzle tree for Excel: every level, indented names
  function puzzleTreeRows(C, p, key, dim, r1, pc, pp) {
    const dl = belowDims(dim), T = puzzleTree(C, p, key, dl), out = [];
    const walk = (rows, depth, rest) => {
      for (const r of rows) {
        out.push([' '.repeat(depth * 4) + r.name, depth ? AS.model.dims[(rest.lvl)] : AS.model.dims[dim], r1(r.S0), r1(r.S1), pc(r.w0), pc(r.w1), r.other ? '' : pc(r.r0), r.other ? '' : pc(r.r1), pp(r.rate), pp(r.mix), pp(r.ne), pp(r.tot)]);
        if (!r.other && rest.dl.length) { const k = T.kids(r, rest.dl); if (k) walk(k.rows, depth + 1, { dl: k.rest, lvl: k.d }); }
      }
    };
    walk(T.rows, 0, { dl, lvl: dim });
    return out;
  }
  function trendCharts(C, leaves) {
    const M = AS.model, s = AS.s;
    if (M.nP < 3 || s.p1 - s.p0 < 2) return null;
    const x = [], S = [[], []], rC = [[], []], rV = [[], []];
    for (let p = s.p0; p <= s.p1; p++) {
      x.push(M.periods[p]);
      for (const [yi, y] of [[0, s.y0], [1, s.y1]]) {
        let a = 0, c = 0, v = 0;
        for (const l of leaves) { const o = ((l * M.nY + y) * M.nP + p) * 5; a += M.data[o]; c += M.data[o + 3]; v += M.data[o + 4]; }
        S[yi].push(a / (s.div || 1)); rC[yi].push(a > 0 ? +(c / a * 100).toFixed(2) : null); rV[yi].push(a > 0 ? +(v / a * 100).toFixed(2) : null);
      }
    }
    const [Y0, Y1] = yrs(), out = el('div', 'charts');
    out.appendChild(chart({ title: `기간별 매출 (${divName()})`, x, series: [{ name: Y0, values: S[0] }, { name: Y1, values: S[1] }] }));
    const ser = [];
    if (M.has.C) ser.push({ name: Y0 + ' 비용율', values: rC[0] }, { name: Y1 + ' 비용율', values: rC[1] });
    if (M.has.V) ser.push({ name: Y0 + ' 원가율', values: rV[0] }, { name: Y1 + ' 원가율', values: rV[1] });
    if (ser.length) out.appendChild(chart({ title: '기간별 비용율 · 원가율 (%)', unit: '%', zero: false, x, series: ser }));
    return out;
  }
  function drawIns(C) {
    const M = AS.model, { list, more } = targets(C), host = $('vIns');
    host.innerHTML = '';
    const wrap = el('div', 'ins');
    for (const t of list) {
      const I = insight(C, t), st = t.s, card = el('div', 'icard ' + st.k);
      const tl = [['매출', `${fN(st.S1)}`, `<span class="${sg(st.gS)}">${fG(st.gS)} (${fD(st.dS)})</span>`]];
      if (M.has.C) tl.push(['비용율', fP(st.c1), `<span class="${sgc(st.dc)}">${fPP(st.dc, 2)}</span> · ${yrs()[0]} ${fP(st.c0)}`]);
      if (M.has.V) tl.push(['원가율', fP(st.v1), `<span class="${sgc(st.dv)}">${fPP(st.dv, 2)}</span> · ${yrs()[0]} ${fP(st.v0)}`]);
      tl.push(['CM', fN(st.M1), `<span class="${sg(st.dM)}">${fD(st.dM)}</span> · CM율 ${fP(st.m1)}`]);
      card.innerHTML = `<h3>${t.top ? '📌 ' : ''}${t.drill ? `<a href="#" data-drill="${t.drill.join(':')}">${esc(t.name)}</a>` : esc(t.name)} ${chip(st.k)} <small>${esc(I.dn)} 기준으로 쪼개 봄 · ${esc(yrs().join(' → '))}${perText() ? ' · ' + esc(perText()) : ''}</small></h3>
        <div class="tiles">${tl.map(([k, v, d]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join('')}</div>
        <ul class="bul">${I.B.map(b => `<li>${b}</li>`).join('')}</ul>`;
      if (t.top) { const tc = trendCharts(C, t.leaves); if (tc) card.appendChild(tc); }
      if (I.subs.length > 1) {
        const two = el('div', 'two');
        if (I.pc) { const d = el('div'); d.innerHTML = puzzleHtml(C, I.pc, '비용율', I.dn, I.dim); two.appendChild(d); }
        if (I.pv) { const d = el('div'); d.innerHTML = puzzleHtml(C, I.pv, '원가율', I.dn, I.dim); two.appendChild(d); }
        card.appendChild(two);
        const cb = el('div'); cb.style.display = 'contents'; cb.innerHTML = contribHtml(C, I); card.appendChild(cb);
      }
      wrap.appendChild(card);
    }
    host.appendChild(wrap);
    if (more > 0) host.appendChild(el('p', 'muted', `${M.dims[AS.s.unit]} ${more}개는 CM 변화가 작아 생략했습니다. 판정표에서 모두 볼 수 있습니다.`));
  }
  $('vIns').addEventListener('click', e => {
    const t = e.target.closest('[data-drill]'); if (!t) return; e.preventDefault();
    const pairs = t.dataset.drill.split(';').map(x => x.split(':').map(Number));
    AS.s.merge = true;
    for (const [d, k] of pairs.slice(0, -1)) AS.s.filt[d] = new Set([k]);
    const [d, k] = pairs[pairs.length - 1]; drill(d, k);
  });

  // ---------- Excel: the analysis as it is selected on screen ----------
  function exportSheets() {
    const M = AS.model, s = AS.s, C = compute(), [Y0, Y1] = yrs(), sheets = [];
    const r1 = v => fin2(v) ? Math.round(v / (s.div || 1) * 10) / 10 : '', pc = v => fin2(v) ? (v * 100).toFixed(2) + '%' : '', pp = v => fin2(v) ? fPP(v, 2) : '';
    sheets.push({ name: '선택 조건', rows: [['항목', '내용'], ['보는 범위', scopeText()], ['금액 단위', divName()], ['판정 기준', `${costName()} +${s.thr}%p 초과 상승: 매출↓ → 큰 문제, 매출↑·CM↓ → 문제, CM 유지 → 비용↑·CM유지`], ['자료', `${M.kind} · ${M.nL.toLocaleString()}개 조합 · ${M.years.join(', ')}`]], header: true, wrap: [1], widths: [14, 110] });
    const { blocks, lines } = sumBlocks(C), sum = [[M.dims[s.unit], '항목', Y0, Y1, 'Δ', '증감률']];
    for (const b of blocks) {
      for (const ln of lines) { const v = lineVals(b.s, ln); sum.push(v.kind === 'amt' ? [b.name, ln[0].trim(), r1(v.a), r1(v.b), r1(v.d), pc(v.g)] : [b.name, ln[0].replace(/^[　·\s]+/, ''), pc(v.a), pc(v.b), pp(v.d), '']); }
      sum.push([b.name, '판정', '', '', JL[b.s.k], '']);
    }
    sheets.push({ name: '요약표', rows: sum, header: true });
    const jr = judgeRows(C), lvName = s.jl === M.dims.length ? '조합' : M.dims[s.jl];
    sheets.push({ name: '판정표', header: true, rows: [['판정', lvName, `매출 ${Y0}`, `매출 ${Y1}`, '매출 증감률', `비용율 ${Y0}`, `비용율 ${Y1}`, '비용율 Δ', `원가율 ${Y0}`, `원가율 ${Y1}`, '원가율 Δ', `CM ${Y0}`, `CM ${Y1}`, 'CM Δ', '매출효과', '비용율효과', '원가율효과'],
      ...jr.map(g => { const t = g.s; return [JL[t.k], g.name, r1(t.S0), r1(t.S1), pc(t.gS), pc(t.c0), pc(t.c1), pp(t.dc), pc(t.v0), pc(t.v1), pp(t.dv), r1(t.M0), r1(t.M1), r1(t.dM), r1(t.eS), r1(t.eC), r1(t.eV)]; })] });
    const ins = [], pz = [];
    for (const t of targets(C).list) {
      const I = insight(C, t);
      ins.push([`■ ${t.name} (${I.dn} 기준) · ${JL[t.s.k]}`]); for (const p of I.plain) ins.push(['· ' + p]); ins.push([]);
      for (const [p, nm] of [[I.pc, '비용율'], [I.pv, '원가율']]) {
        if (!p || I.subs.length < 2) continue;
        pz.push([`${t.name} · ${nm} 증감 퍼즐 (${I.dn} 이하 모두 펼침, 들여쓰기 = 하위)`], ['이름', '단계', `매출 ${Y0}`, `매출 ${Y1}`, `구성비 ${Y0}`, `구성비 ${Y1}`, `${nm} ${Y0}`, `${nm} ${Y1}`, '① 율', '② 구성비', '③ 종료·신규', '기여 합계']);
        for (const row of puzzleTreeRows(C, p, nm === '비용율' ? 'c' : 'v', I.dim, r1, pc, pp)) pz.push(row);
        pz.push(['합계', '', r1(p.S0), r1(p.S1), '100%', '100%', pc(p.R0), pc(p.R1), pp(p.rate), pp(p.mix), pp(p.ne), pp(p.dR)], []);
      }
    }
    sheets.push({ name: 'INSIGHT', rows: ins, wrap: [0], widths: [150] });
    if (pz.length) sheets.push({ name: '증감 퍼즐', rows: pz });
    return sheets;
  }

  // ---------- 요청 · 추가 분석: requests saved next to the reply, answers written back by Claude ----------
  // requests/<reply>/<stamp>.json = { text, scope, state, createdAt }; <stamp>.answer.json = { title, summary, items:[{title, body}], table:{head, rows} }
  let reqState = null;
  async function drawReq() {
    const c = cur; if (!c) return;
    const base = c.name.replace(/\.(txt|json)$/, ''), host = $('vReq'), ready = AS && AS.model;
    host.innerHTML = `<div class="req"><h3 style="margin:0;font-size:15px">요청 쓰기</h3>
      <p class="muted">기본 화면 말고 더 보고 싶은 분석을 적어주세요. 지금 고른 범위가 같이 저장됩니다. 저장한 뒤 디스코드에 "요청 넣음"이라고 보내주시면 Claude가 답을 이 탭에 올립니다.</p>
      <p class="muted">지금 범위: ${ready ? esc(scopeText()) : '(자료를 읽는 중이거나 자동 분석이 안 되는 자료)'}</p>
      <textarea id="reqText" maxlength="4000" placeholder="예: 01.도매 안에서 제품군별로 원가율이 오른 이유를 SKU까지 보여줘"></textarea>
      <div class="bar"><span class="grow" id="reqInfo"></span><button type="button" class="btn primary" id="reqSend">요청 저장</button></div></div>
      <h3 style="margin:4px 0 0;font-size:15px">요청과 답</h3><div class="ins" id="reqList"><p class="muted">불러오는 중입니다.</p></div>
      ${c.note ? `<details class="memo"><summary>메모 (Claude)</summary><p class="summary">${esc(c.note)}</p></details>` : ''}`;
    $('reqSend').addEventListener('click', () => sendReq(c, base));
    const my = reqState = {};
    try {
      let items = [];
      try { items = await (await api('/contents/requests/' + encodeURIComponent(base))).json(); } catch (e) { if (e.status !== 404) throw e; }
      const names = new Set(items.filter(i => i.type === 'file').map(i => i.name));
      const qs = [...names].filter(n => /^\d{8}-\d{6}\.json$/.test(n)).sort().reverse();
      const out = [];
      for (const n of qs) {
        const get = async f => JSON.parse(await (await api(`/contents/requests/${encodeURIComponent(base)}/${f}`, { accept: 'application/vnd.github.raw+json' })).text());
        const q = await get(n), a = names.has(n.replace(/\.json$/, '.answer.json')) ? await get(n.replace(/\.json$/, '.answer.json')) : null;
        out.push({ n, q, a });
      }
      if (my !== reqState || c !== cur) return;
      const list = $('reqList');
      if (!out.length) { list.innerHTML = '<p class="muted">아직 요청이 없습니다.</p>'; return; }
      list.innerHTML = out.map(({ n, q, a }, i) => `<div class="qa"><div class="muted">${esc(n.slice(0, 13).replace(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/, '$1-$2-$3 $4:$5'))} · ${esc(q.scope || '')}${q.state ? ` <button type="button" class="btn small" data-apply="${i}">이 범위로 보기</button>` : ''}</div>
        <div class="q">${esc(q.text || '')}</div>${a ? ansHtml(a) : '<div class="a muted">답 기다리는 중</div>'}</div>`).join('');
      list.onclick = e => { const b = e.target.closest('[data-apply]'); if (!b || !AS || !AS.model) return; applyState(AS.model, AS.s, out[+b.dataset.apply].q.state); saveState(); view('vIns'); };
    } catch (e) { if (my === reqState) $('reqList').innerHTML = `<p class="err">${esc(explain(e))}</p>`; }
  }
  function ansHtml(a) {
    let h = '<div class="a">';
    if (a.title) h += `<b>${esc(a.title)}</b>\n`;
    if (a.summary) h += esc(a.summary) + '\n';
    for (const it of a.items || []) h += `\n<b>${esc(it.title || '')}</b>\n${esc(it.body || '')}\n`;
    h += '</div>';
    if (a.table && a.table.rows) h += `<div class="tw"><table class="at"><thead><tr>${(a.table.head || []).map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${a.table.rows.map(r => `<tr>${r.map(x => `<td class="${typeof x === 'number' || /^[-+]?[\d,.]+%?p?$/.test(String(x)) ? 'n' : 'l'}">${esc(typeof x === 'number' ? fN(x) : x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    return h;
  }
  async function sendReq(c, base) {
    const text = $('reqText').value.trim(); if (!text) { $('reqInfo').textContent = '요청을 적어주세요.'; return; }
    const p2 = n => String(n).padStart(2, '0'), d = new Date();
    const stamp = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
    const body = { reply: c.name, text, createdAt: d.toISOString() };
    if (AS && AS.model && AS.c === c) { body.scope = scopeText(); body.state = stateOut(); }
    $('reqSend').disabled = true; $('reqInfo').textContent = '저장하는 중입니다.';
    try {
      await put(`requests/${base}/${stamp}.json`, toBase64(new TextEncoder().encode(JSON.stringify(body, null, 2))), `request ${base} ${stamp}`);
      $('reqInfo').textContent = `저장했습니다 (${stamp}). 디스코드에 "요청 넣음"이라고 보내주세요.`;
      $('reqText').value = '';
      drawReq().then(() => { $('reqInfo') && ($('reqInfo').textContent = `저장했습니다 (${stamp}). 디스코드에 "요청 넣음"이라고 보내주세요.`); });
    } catch (e) { $('reqInfo').textContent = '저장하지 못했습니다. ' + explain(e); $('reqSend').disabled = false; }
  }
  $('refreshBtn').addEventListener('click', loadList);

  const saved = store.get();
  if (saved) connect(saved, false, true);
})();
</script>
